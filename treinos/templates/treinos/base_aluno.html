<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Meu treino{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-3xl flex-wrap items-center gap-3 px-4 py-3">
      <span class="mr-auto text-sm font-semibold">{{ aluno.rede.nome|default:"Academia" }}</span>
      <nav class="flex flex-wrap gap-3 text-sm">
        <a class="text-slate-600" href="/aluno/">Início</a>
        <a class="text-slate-600" href="{% url 'treinos:meus_treinos' %}">Meus treinos</a>
        <a class="text-slate-600" href="{% url 'treinos:minha_evolucao' %}">Evolução</a>
        <a class="text-slate-600" href="{% url 'portal:agenda' %}">Agenda</a>
        <a class="text-slate-600" href="{% url 'portal:pagamentos' %}">Pagamentos</a>
        <a class="text-slate-600" href="{% url 'portal:ficha' %}">Ficha de saúde</a>
        <a class="text-slate-600" href="{% url 'portal:perfil' %}">Perfil</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-4 py-5">
    {% if messages %}
      {% for message in messages %}
      <div class="mb-3 rounded-lg px-4 py-2 text-sm {% if message.tags == 'error' %}bg-rose-50 text-rose-800{% else %}bg-emerald-50 text-emerald-800{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
