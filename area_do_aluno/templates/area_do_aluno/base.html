<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ marca.cor|default:'#0f172a' }}">
  <title>{% block titulo %}{{ marca.nome }}{% endblock %}</title>
  <link rel="manifest" href="{% url 'aluno:manifest' %}">
  <link rel="icon" href="{% url 'aluno:icone' 192 %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Acessibilidade AA: foco sempre visivel e alvo de toque confortavel */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #0ea5e9; outline-offset: 2px; border-radius: 6px;
    }
    .pular { position: absolute; left: -9999px; }
    .pular:focus { left: 0; top: 0; background: #0f172a; color: #fff; padding: .5rem 1rem; z-index: 50; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<a class="pular" href="#conteudo">Pular para o conteudo</a>
<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur">
  <div class="mx-auto flex max-w-md items-center justify-between">
    <span class="text-sm font-semibold">{{ marca.nome }}</span>
    <nav aria-label="Navegacao do aluno" class="flex gap-3 text-xs">
      <a href="{% url 'aluno:inicio' %}" class="hover:underline">Inicio</a>
      <a href="{% url 'aluno:pontos' %}" class="hover:underline">Pontos</a>
    </nav>
  </div>
</header>
<main id="conteudo" class="mx-auto max-w-md space-y-4 p-4">
  {% if messages %}
  <ul aria-live="polite" class="space-y-2">
    {% for mensagem in messages %}
    <li class="rounded-lg px-3 py-2 text-sm {% if mensagem.tags == 'error' %}bg-rose-50 text-rose-700{% else %}bg-emerald-50 text-emerald-700{% endif %}">
      {{ mensagem }}
    </li>
    {% endfor %}
  </ul>
  {% endif %}
  {% block conteudo %}{% endblock %}
</main>
<footer class="mx-auto max-w-md p-4 text-center text-xs text-slate-400">
  {% block rodape %}Funciona offline: adicione a tela de inicio.{% endblock %}
</footer>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/aluno/sw.js', {scope: '/aluno/'}));
  }
</script>
</body>
</html>
