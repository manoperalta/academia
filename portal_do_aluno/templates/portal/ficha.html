{% extends "treinos/base_aluno.html" %}
{% block conteudo %}
<h1 class="mb-3 text-lg font-semibold">Minha ficha de saúde</h1>
<div class="rounded-xl bg-white p-4 shadow">
  <form method="post">
    {% csrf_token %}
    <div class="grid gap-3 sm:grid-cols-2">
      <label class="text-xs text-slate-600">Altura (m)
        <input name="altura" value="{{ ficha.altura|default:'' }}" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </label>
      <label class="text-xs text-slate-600">Peso (kg)
        <input name="peso" value="{{ ficha.peso|default:'' }}" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </label>
      <label class="text-xs text-slate-600 sm:col-span-2">Restrições (lesão, problema cardíaco, gestação…)
        <textarea name="restricoes" rows="2" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">{{ ficha.restricoes|default:'' }}</textarea>
      </label>
      <label class="text-xs text-slate-600 sm:col-span-2">Prescrições médicas
        <textarea name="prescricoes" rows="2" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">{{ ficha.prescricoes|default:'' }}</textarea>
      </label>
      <label class="flex items-center gap-2 text-xs text-slate-600">
        <input type="checkbox" name="usa_medicamento" {% if ficha.usa_medicamento %}checked{% endif %}> Uso medicamento contínuo
      </label>
      <label class="text-xs text-slate-600">Qual?
        <input name="qual_medicamento" value="{{ ficha.qual_medicamento|default:'' }}" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </label>
      <label class="text-xs text-slate-600 sm:col-span-2">Observações
        <textarea name="observacoes" rows="2" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">{{ ficha.obs|default:'' }}</textarea>
      </label>
    </div>
    <button class="mt-3 rounded-lg bg-slate-900 px-4 py-2 text-sm text-white">Salvar ficha</button>
  </form>
  <p class="mt-2 text-xs text-slate-500">
    Dado de saúde: fica guardado com acesso restrito e registrado, e o professor vê para montar seu treino com segurança.
  </p>
</div>
{% endblock %}
