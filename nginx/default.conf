server {
    listen 80;
    server_name academia.safestack.com.br localhost;

    # Video de aula chega a 450 MB (limite do produto): sem isso o envio morre no proxy.
    client_max_body_size 500m;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Landing que ja rodava em producao, servida congelada (decisao do dono). Se o arquivo
    # nao estiver montado, cai no app (ambiente de desenvolvimento/demonstracao).
    location = / {
        root /app/landing;
        try_files /atual.html @app;
    }

    location @app {
        include uwsgi_params;
        uwsgi_pass web:8000;
        uwsgi_read_timeout 120;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass web:8000;
        uwsgi_read_timeout 120;
    }
}
