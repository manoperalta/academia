{% extends "plataforma/base.html" %}
{% block conteudo %}
<form method="post" class="max-w-3xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  {% csrf_token %}
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    {% for campo in form %}
      <div class="{% if campo.name == 'modulos' %}md:col-span-2{% endif %}">
        <label class="mb-1 block text-xs font-medium text-slate-600">{{ campo.label }}</label>{{ campo }}
        {% for erro in campo.errors %}<p class="mt-1 text-xs text-red-600">{{ erro }}</p>{% endfor %}
      </div>
    {% endfor %}
  </div>
  <div class="mt-5 flex gap-3">
    <button class="rounded-lg bg-emerald-600 px-5 py-2 text-sm text-white">Salvar pacote</button>
    <a href="{% url 'plataforma:pacotes' %}" class="text-sm text-slate-600 hover:underline">Cancelar</a>
  </div>
</form>
{% endblock %}
