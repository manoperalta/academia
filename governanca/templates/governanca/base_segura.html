{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Acesso{% endblock %} · Academia SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <div class="mx-auto flex max-w-lg flex-col justify-center px-4 py-14">
    <a href="{% url 'vitrine:home' %}" class="mb-6 flex items-center gap-2 self-center">
      <span class="inline-block h-8 w-8 rounded-lg bg-emerald-500"></span>
      <span class="font-semibold text-slate-900">Academia<span class="text-emerald-600">SaaS</span></span>
    </a>
    {% if messages %}
      {% for mensagem in messages %}
        <div class="mb-3 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900">{{ mensagem }}</div>
      {% endfor %}
    {% endif %}
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      {% block conteudo %}{% endblock %}
    </div>
    <p class="mt-6 text-center text-xs text-slate-400">
      SafeStack · <a class="underline" href="{% url 'governanca:status' %}">status do serviço</a> ·
      <a class="underline" href="{% url 'governanca:privacidade' %}">privacidade</a>
    </p>
  </div>
</body>
</html>
