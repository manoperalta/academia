{% extends 'base.html' %}

{% block title %}Excluir Plano - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Excluir Plano</h4>
            </div>
            <div class="card-body text-center p-4">
                <i class="fas fa-exclamation-triangle fa-4x text-danger mb-4"></i>
                <p class="fs-5">Você tem certeza que deseja excluir o plano <strong>{{ plano.nome }}</strong>?</p>
                <p class="text-muted">Esta ação não pode ser desfeita.</p>

                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'plano_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sim, Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
