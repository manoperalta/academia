<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir senha</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 p-4 text-slate-800">
  <div class="w-full max-w-md rounded-xl bg-white p-6 shadow">
    <h1 class="text-lg font-semibold">Redefinir senha</h1>
    <p class="mt-1 text-xs text-slate-500">Informe seu e-mail: enviamos um link com validade curta.</p>
    <form method="post" class="mt-4">
      {% csrf_token %}
      <label class="text-xs text-slate-600">E-mail
        <input type="email" name="email" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </label>
      <button class="mt-4 w-full rounded-lg bg-slate-900 px-4 py-2 text-sm text-white">Enviar link</button>
    </form>
    <p class="mt-3 text-xs text-slate-400">Por segurança, a resposta é a mesma exista ou não o e-mail cadastrado.</p>
  </div>
</body>
</html>
