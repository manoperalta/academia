<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Nova senha</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 p-4 text-slate-800">
  <div class="w-full max-w-md rounded-xl bg-white p-6 shadow">
  {% if validlink %}
    <h1 class="text-lg font-semibold">Definir nova senha</h1>
    <form method="post" class="mt-4">
      {% csrf_token %}
      {% for campo in form %}
      <label class="mt-3 block text-xs text-slate-600">{{ campo.label }}
        <input type="password" name="{{ campo.name }}" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        {% if campo.errors %}<span class="mt-1 block text-xs text-rose-600">{{ campo.errors|join:", " }}</span>{% endif %}
      </label>
      {% endfor %}
      <button class="mt-4 w-full rounded-lg bg-slate-900 px-4 py-2 text-sm text-white">Salvar nova senha</button>
    </form>
  {% else %}
    <h1 class="text-lg font-semibold">Link inválido ou expirado</h1>
    <p class="mt-2 text-sm text-slate-600">Peça um novo link de redefinição.</p>
    <a class="mt-4 inline-block text-sm text-sky-700 underline" href="{% url 'conta:senha_redefinir' %}">Pedir novo link</a>
  {% endif %}
  </div>
</body>
</html>
